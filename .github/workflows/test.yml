name: OPA Policy Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-policies:
    name: Lint and Test Rego Policies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: 'v1.20.2'

      - name: Setup Regal Linter
        uses: styrainc/setup-regal@v0.2.0
        with:
          version: 'v0.26.0'

      - name: Lint Rego Policies with Regal
        run: regal lint lib/ bundles/

      - name: Run OPA Unit Tests
        run: opa test lib/ bundles/ -v
